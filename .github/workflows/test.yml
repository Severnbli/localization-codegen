name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
    # Only run when something the plugin tests actually depend on changes.
    # (paths and paths-ignore can't be combined; "!" patterns exclude from the list above them.)
    paths:
      - "Unity-Package/**"
      - "Unity-Tests/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/test_unity_plugin.yml"
      - "!**.md"
      - "!Unity-Package/Assets/root/Documentation~/**"

# A new push to the same PR cancels the previous (expensive) Unity run.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-unity:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        unityVersion: [2022.3.62f3, 6000.3.1f1]
        testMode: [editmode, playmode, standalone]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: ./Unity-Tests/${{ matrix.unityVersion }}
      unityVersion: ${{ matrix.unityVersion }}
      testMode: ${{ matrix.testMode }}
    secrets: inherit