name: release

# Releases are published only on demand. The workflow runs the full Unity test
# matrix itself, so a manually triggered release is still gated on green tests.
on:
  workflow_dispatch:

# Two concurrent manual runs must not race on the same tag. Queue, don't cancel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  INSTALLER_UNITY_VERSION: 2022.3.62f3

jobs:
  check-version-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      package_name: ${{ steps.info.outputs.package_name }}
      # "<package-name>-<version>", the common part of every release asset name.
      suffix: ${{ steps.info.outputs.suffix }}
      prev_tag: ${{ steps.info.outputs.prev_tag }}
      tag_exists: ${{ steps.info.outputs.tag_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version, previous tag and tag existence
        id: info
        run: |
          set -euo pipefail
          version="$(jq -r .version Unity-Package/Assets/root/package.json)"
          package_name="$(jq -r .name Unity-Package/Assets/root/package.json)"
          prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${version}")" ]; then
            tag_exists=true
          else
            tag_exists=false
          fi
          {
            echo "version=${version}"
            echo "package_name=${package_name}"
            echo "suffix=${package_name}-${version}"
            echo "prev_tag=${prev_tag}"
            echo "tag_exists=${tag_exists}"
          } >> "$GITHUB_OUTPUT"

  # Generates release notes (release.md) in parallel with tests/builds.
  # The artifact is consumed by release-unity-plugin's atomic publish step.
  prepare-release-notes:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    if: needs.check-version-tag.outputs.tag_exists == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release description
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version-tag.outputs.version }}
          PREV_TAG: ${{ needs.check-version-tag.outputs.prev_tag }}
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          today="$(date +'%B %-d, %Y')"

          {
            echo "# Package ${VERSION}"
            echo "**Released:** *${today}*"
            echo ""
            echo "---"
            echo ""
          } > release.md

          if [ -n "$PREV_TAG" ]; then
            {
              echo "## Comparison"
              echo "See every change: [Compare ${PREV_TAG}...${VERSION}](${repo_url}/compare/${PREV_TAG}...${VERSION})"
              echo ""
              echo "---"
              echo ""
              echo "## Commit Summary (Newest → Oldest)"
            } >> release.md

            # One API call for the whole range (login lookup), oldest-first -> reverse.
            # Falls back to plain git log (newest-first, author name) if the API call fails.
            if ! commits="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_SHA}" \
                --jq '.commits[] | [.sha, (.commit.message | split("\n")[0]), (.author.login // .commit.author.name)] | @tsv' \
                2>/dev/null | tac)" || [ -z "$commits" ]; then
              commits="$(git log --pretty=format:'%H%x09%s%x09%an' "${PREV_TAG}..HEAD")"
            fi

            while IFS=$'\t' read -r sha message username; do
              [ -z "$sha" ] && continue
              echo "- [\`${sha:0:7}\`](${repo_url}/commit/${sha}) — ${message} by @${username}" >> release.md
            done <<< "$commits"
          fi

      - name: Upload release notes as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ./release.md
          retention-days: 1

  build-unity-installer:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    if: needs.check-version-tag.outputs.tag_exists == 'false'
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./Installer/Library
          key: Library-Unity-Installer-${{ hashFiles('Installer/Packages/manifest.json', 'Installer/Packages/packages-lock.json') }}

      - name: Test Unity Installer (EditMode)
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./Installer
          unityVersion: ${{ env.INSTALLER_UNITY_VERSION }}
          customImage: "unityci/editor:ubuntu-${{ env.INSTALLER_UNITY_VERSION }}-base-3"
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Installer EditMode Test Results
          artifactsPath: artifacts-installer-editmode
          customParameters: -CI true -GITHUB_ACTIONS true

      - name: Upload Unity Installer EditMode artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-installer-editmode
          path: artifacts-installer-editmode

      - name: Clean Unity artifacts and reset git state
        run: |
          # Force remove Unity generated files with restricted permissions
          sudo rm -rf ./Installer/Logs/ || true
          sudo rm -rf ./Installer/Temp/ || true
          sudo rm -rf ./artifacts-installer-editmode/ || true

          # Reset only tracked files to their committed state
          git reset --hard HEAD
          echo "Cleaned Unity artifacts and reset tracked files"

      - name: Export Unity Package
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./Installer
          unityVersion: ${{ env.INSTALLER_UNITY_VERSION }}
          customImage: "unityci/editor:ubuntu-${{ env.INSTALLER_UNITY_VERSION }}-base-3"
          buildName: Localization-Codegen-Installer
          buildsPath: build
          buildMethod: Severnbli.LocalizationCodegen.Installer.PackageExporter.ExportPackage
          customParameters: -CI true -GITHUB_ACTIONS true

      # (3) The exporter always writes Localization-Codegen-Installer.unitypackage;
      # rename it to the release naming scheme.
      - name: Rename installer to release asset name
        env:
          SUFFIX: ${{ needs.check-version-tag.outputs.suffix }}
        run: |
          set -euo pipefail
          mv ./Installer/build/Localization-Codegen-Installer.unitypackage \
             "./Installer/build/installer-${SUFFIX}.unitypackage"

      - name: Upload Unity Package as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-installer-package
          path: ./Installer/build/installer-${{ needs.check-version-tag.outputs.suffix }}.unitypackage
          retention-days: 1

  # Builds the signed UPM package (.tgz with package/.attestation.p7m) in parallel
  # with tests/builds and uploads it as a `signed-upm-package` artifact for the
  # atomic release publish in release-unity-plugin.
  #
  # HARD-GATE: this job is NOT continue-on-error. Missing UPM signing secrets fail
  # fast and the release pipeline halts - no GitHub Release is created without a
  # signed UPM tarball (see docs/openupm-signing.md for the blocking-semantics
  # rationale).
  #
  # Required repo secrets (configure via `gh secret set --repo IvanMurzak/YOUR_REPO <NAME>`):
  #   - UPM_SERVICE_ACCOUNT_KEY_ID
  #   - UPM_SERVICE_ACCOUNT_KEY_SECRET
  #   - UPM_ORG_ID
  # Required repo variable:
  #   - UPM_INSTALL_SHA256  (sha256 of the pinned UPM CLI install script; the
  #     "Install Unity UPM CLI" step prints the observed hash when it mismatches)
  # See https://openupm.com/docs/signing-upm-packages.html for the procedure.
  build-signed-upm-package:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    if: needs.check-version-tag.outputs.tag_exists == 'false'
    env:
      PACKAGE_DIR: Unity-Package/Assets/root
      DIST_DIR: /tmp/signed-upm-dist
    steps:
      - name: Verify signing secrets are configured
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
        run: |
          missing=()
          [ -z "$UPM_SERVICE_ACCOUNT_KEY_ID" ]     && missing+=("UPM_SERVICE_ACCOUNT_KEY_ID")
          [ -z "$UPM_SERVICE_ACCOUNT_KEY_SECRET" ] && missing+=("UPM_SERVICE_ACCOUNT_KEY_SECRET")
          [ -z "$UPM_ORG_ID" ]                     && missing+=("UPM_ORG_ID")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::UPM signing secrets are not configured (%s). The release pipeline is hard-gated on signing - see docs/openupm-signing.md for setup.\n' "${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package metadata
        id: meta
        run: |
          package_name="$(jq -r '.name' "$PACKAGE_DIR/package.json")"
          package_version="$(jq -r '.version' "$PACKAGE_DIR/package.json")"

          printf 'Package name: %s\n' "$package_name"
          printf 'Package version: %s\n' "$package_version"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"

      # No secrets are exposed to this step. The install script is only run if its
      # hash matches the one pinned in the UPM_INSTALL_SHA256 repo variable.
      - name: Install Unity UPM CLI
        env:
          EXPECTED_SHA256: ${{ vars.UPM_INSTALL_SHA256 }}
        run: |
          set -euo pipefail
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          actual="$(sha256sum install.sh | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::UPM install script sha256 mismatch (or UPM_INSTALL_SHA256 unset). Observed: $actual"
            exit 1
          fi
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        run: upm --help

      - name: Sign package
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
        run: |
          mkdir -p "$DIST_DIR"
          upm pack "./$PACKAGE_DIR" --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Verify signed package contains attestation
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          SUFFIX: ${{ needs.check-version-tag.outputs.suffix }}
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed package archive, found %s: %s\n' "${#archives[@]}" "${archives[*]:-<none>}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          archive_basename="$(basename "$archive")"
          # `upm pack` names the file "<package-name>-<version>.tgz". Fail loudly if
          # that ever changes, then rename it to the release asset name.
          if [[ "$archive_basename" != "${PACKAGE_NAME}-"* ]]; then
            printf 'Signed archive basename %q does not begin with %s- (upm pack naming changed?)\n' "$archive_basename" "$PACKAGE_NAME" >&2
            exit 1
          fi

          # (2) OpenUPM picks the asset by prefix, so the OpenUPM package YAML must
          # say: githubReleaseAssetName: 'tarball-<package-name>-'
          # (renaming does not touch the signature, which lives inside the archive).
          final="$DIST_DIR/tarball-${SUFFIX}.tgz"
          mv "$archive" "$final"
          archive="$final"
          archive_basename="$(basename "$archive")"

          archive_entries="$(tar -tzf "$archive")"
          grep -qx 'package/package.json'      <<<"$archive_entries"
          grep -qx 'package/.attestation.p7m'  <<<"$archive_entries"

          printf 'Signed archive: %s\n' "$archive_basename"
          tar -xOzf "$archive" package/package.json | jq '{name, version}'

      - name: Upload signed UPM package as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-upm-package
          path: /tmp/signed-upm-dist/*.tgz
          retention-days: 1

  # Builds a .unitypackage with the contents of the package, for people who
  # prefer "Assets > Import Package > Custom Package" over OpenUPM.
  #
  # Pure shell, no Unity license needed: a .unitypackage is a gzipped tar with
  # one <guid>/{asset,asset.meta,pathname} folder per file. GUIDs come from the
  # committed .meta files, so references survive the import and a later upgrade.
  #
  # Unity cannot sign a .unitypackage (UPM signing only exists for package
  # tarballs). Integrity of this file is covered by the build provenance
  # attestation created in release-unity-plugin.
  build-package-unitypackage:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    if: needs.check-version-tag.outputs.tag_exists == 'false'
    env:
      PACKAGE_DIR: Unity-Package/Assets/root
      SUFFIX: ${{ needs.check-version-tag.outputs.suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build .unitypackage from the package folder
        run: |
          set -euo pipefail

          # Folder the package lands in inside the user's project. This is only
          # the "pathname" recorded in the .unitypackage; no source change needed.
          install_dir="Assets/Plugins/LocalizationCodegen"
          out="$PWD/dist/${SUFFIX}.unitypackage"
          work="$(mktemp -d)"
          mkdir -p "$PWD/dist"

          count=0
          while IFS= read -r -d '' meta; do
            item="${meta%.meta}"
            rel="${item#"$PACKAGE_DIR"/}"

            # package.json is UPM-only metadata; it has no place under Assets/.
            [ "$rel" = "package.json" ] && continue
            # Orphaned .meta file without its asset.
            [ -e "$item" ] || continue

            guid="$(sed -n 's/^guid: *\([0-9a-f]\{32\}\).*/\1/p' "$meta" | head -n1)"
            if [ -z "$guid" ]; then
              echo "::error::No GUID found in $meta"
              exit 1
            fi

            mkdir -p "$work/$guid"
            cp "$meta" "$work/$guid/asset.meta"
            printf '%s' "$install_dir/$rel" > "$work/$guid/pathname"
            # Folders have pathname + meta only.
            [ -f "$item" ] && cp "$item" "$work/$guid/asset"
            count=$((count + 1))
          done < <(find "$PACKAGE_DIR" -mindepth 1 -name '*.meta' -print0)

          if [ "$count" -eq 0 ]; then
            echo "::error::No .meta files found under $PACKAGE_DIR - nothing to pack"
            exit 1
          fi

          # Entries must be "<guid>/..." without a leading "./".
          find "$work" -mindepth 1 -maxdepth 1 -printf '%P\n' | sort \
            | tar -czf "$out" -C "$work" -T -

          echo "Packed $count entries into $(basename "$out")"
          tar -tzf "$out" | head -n 12

      - name: Upload package unitypackage as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-unitypackage
          path: dist/*.unitypackage
          retention-days: 1

  # --- UNITY TESTS ---
  # Runs in parallel with the installer build; add a Unity version or test mode
  # by editing the matrix below.
  test-unity:
    needs: [check-version-tag]
    if: needs.check-version-tag.outputs.tag_exists == 'false'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        unityVersion: [2022.3.62f3, 6000.3.1f1]
        testMode: [editmode, playmode, standalone]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: ./Unity-Tests/${{ matrix.unityVersion }}
      unityVersion: ${{ matrix.unityVersion }}
      testMode: ${{ matrix.testMode }}
    secrets: inherit

  # Atomic publish point - gated on EVERY prerequisite (tests, installer build,
  # signed UPM package, release notes). Downloads all asset artifacts and creates
  # the GitHub Release + tag with the full asset set in a SINGLE
  # softprops/action-gh-release call so a failed upload cannot strand the
  # release with incomplete assets. Signing failure -> no release (hard gate).
  release-unity-plugin:
    runs-on: ubuntu-latest
    needs:
      [
        check-version-tag,
        prepare-release-notes,
        build-unity-installer,
        build-signed-upm-package,
        build-package-unitypackage,
        test-unity,
      ]
    if: needs.check-version-tag.outputs.tag_exists == 'false'
    permissions:
      contents: write
      # Needed by the build provenance attestation below.
      id-token: write
      attestations: write
    outputs:
      version: ${{ needs.check-version-tag.outputs.version }}
    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ./release-notes

      - name: Download Unity installer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unity-installer-package
          path: ./assets

      - name: Download signed UPM package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-upm-package
          path: ./assets

      - name: Download package unitypackage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-unitypackage
          path: ./assets

      - name: List assembled release assets
        run: |
          set -e
          echo "Release notes:"
          ls -la ./release-notes
          echo ""
          echo "Release assets:"
          ls -la ./assets

      # Signs every release file with a GitHub build provenance attestation, which
      # is the signature mechanism that works for a .unitypackage. Verify with:
      #   gh attestation verify <file> --repo Severnbli/localization-codegen
      # TODO: pin to a commit SHA like the other actions (check the latest major).
      - name: Attest build provenance of release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ./assets/*.unitypackage
            ./assets/*.tgz

      - name: Create Tag and Release with all assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check-version-tag.outputs.version }}
          name: ${{ needs.check-version-tag.outputs.version }}
          body_path: ./release-notes/release.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./assets/${{ needs.check-version-tag.outputs.suffix }}.unitypackage
            ./assets/tarball-${{ needs.check-version-tag.outputs.suffix }}.tgz
            ./assets/installer-${{ needs.check-version-tag.outputs.suffix }}.unitypackage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}