name: test-pull-request

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"

# A new push to the same PR cancels the previous (expensive) Unity run.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-unity:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        unityVersion: [2022.3.62f3, 6000.3.1f1]
        testMode: [editmode, playmode, standalone]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: ./Unity-Tests/${{ matrix.unityVersion }}
      unityVersion: ${{ matrix.unityVersion }}
      testMode: ${{ matrix.testMode }}
    secrets: inherit
