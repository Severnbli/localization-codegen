name: test-unity-plugin

##############################################################################
# 1. Triggers
##############################################################################
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      projectPath: { required: true, type: string }
      unityVersion: { required: true, type: string }
      testMode: { required: true, type: string }
    secrets:
      UNITY_LICENSE: { required: true }
      UNITY_EMAIL: { required: true }
      UNITY_PASSWORD: { required: true }

##############################################################################
# 1-b. Permissions - allow the test-runner to publish results as a check run
##############################################################################
permissions:
  contents: read
  checks: write

##############################################################################
# 2. Job
#
# NOTE: this workflow is called from `pull_request` / `push` workflows. Fork PRs
# do not receive secrets in that context, so Unity activation fails for
# outside contributors. That is intentional here (no pull_request_target).
##############################################################################
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The windows-mono image only matters for standalone builds.
        platform: ${{ fromJSON(inputs.testMode == 'standalone' && '["base","windows-mono"]' || '["base"]') }}

    name: ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # Key changes whenever the package set changes; restore-keys falls back to
      # the most recent cache for the same version/mode/platform.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.projectPath }}/Library
            ~/.cache/unity3d
          key: unity-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.projectPath), format('{0}/Packages/packages-lock.json', inputs.projectPath)) }}
          restore-keys: |
            unity-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}-

      - name: Generate custom image name
        id: custom_image
        env:
          UNITY_VERSION: ${{ inputs.unityVersion }}
          PLATFORM: ${{ matrix.platform }}
        run: echo "image=unityci/editor:ubuntu-${UNITY_VERSION}-${PLATFORM}-3" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ inputs.projectPath }}
          unityVersion: ${{ inputs.unityVersion }}
          testMode: ${{ inputs.testMode }}
          customImage: ${{ steps.custom_image.outputs.image }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ inputs.unityVersion }} ${{ inputs.testMode }} ${{ matrix.platform }} Test Results
          artifactsPath: artifacts-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}
          customParameters: -CI true -GITHUB_ACTIONS true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Test results for ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}
          path: ${{ steps.tests.outputs.artifactsPath }}
